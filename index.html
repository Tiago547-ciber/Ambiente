<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODELAR</title>
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url("assets/amb3.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 20px;
      gap: 20px;
    }

    /* Painel de Preços */
    .precos {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      border: 3px solid #000;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 10;
    }

    .precos h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
      font-family: 'Apple Chancery', cursive, sans-serif;
    }

    .precos label {
      font-weight: bold;
      font-size: 18px;
      display: block;
      margin-top: 10px;
    }

    .valor-item {
      font-weight: bold;
      font-size: 24px;
      color: red;
      margin-bottom: 10px;
    }

    .valor-total {
      font-weight: bold;
      font-size: 32px;
      color: #000;
      text-align: center;
      margin-top: 15px;
      border-top: 2px solid #ccc;
      padding-top: 10px;
    }

    /* Area de Visualização Visual */
    .visualizador {
      position: relative;
      flex: 1;
      min-width: 300px;
      height: 600px;
    }

    #porta {
      position: absolute;
      width: 80%;
      height: 90%;
      top: 5%;
      left: 10%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 1;
    }

    #fechadura {
      position: absolute;
      top: 45%;
      right: 25%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 2;
    }

    #puxador {
      position: absolute;
      top: 40%;
      right: 28%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 3;
    }

    /* Controles e Seletores */
    .opcoes {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
    }

    select {
      width: 100%;
      padding: 12px;
      font-weight: bold;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
      .precos, .opcoes {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Painel Lateral: Preços -->
    <div class="precos">
      <h1>Sua Porta dos Sonhos...</h1>
      
      <label>Porta:</label>
      <div id="preco1" class="valor-item">R$ 0,00</div>

      <label>Fechadura:</label>
      <div id="preco2" class="valor-item">R$ 0,00</div>

      <label>Puxador:</label>
      <div id="preco3" class="valor-item">R$ 0,00</div>

      <label>...por Apenas:</label> 
      <div id="total" class="valor-total">R$ 0,00</div>
    </div>

    <!-- Área Central: Visualização -->
    <div class="visualizador">
      <div id="porta"></div>
      <div id="fechadura"></div>
      <div id="puxador"></div>
    </div>

    <!-- Controles de Seleção -->
    <div class="opcoes">
      <select id="opPort">
        <option value="default">Selecione uma Porta</option>
        <option value="por1">Kit de porta Lisa Branco 2,10 x 0,80 Artens</option>
        <option value="por2">Kit de porta Lisa Curupixá 2,10 x 0,80 Artens</option>
      </select>

      <select id="opFec">
        <option value="default">Selecione uma Fechadura</option>
        <option value="fec1">Fechadura Eletrônica Digital Elsys ESF-DE4000B Embutir</option>
        <option value="fec2">Fechadura Eletrônica Digital Elsys ESF-DE4000B</option>
        <option value="fec3">Fechadura Digital Intelbras Senha e Biometria MFV3000</option>
        <option value="fec4">Fechadura Digital Intelbras Senha FV101 Preto Sobrepor</option>
        <option value="fec5">Fechadura Digital Elsys Senha e TAG Tecno Prata Sobrepor</option>
      </select>

      <select id="opPux">
        <option value="default">Selecione um Puxador</option>
        <option value="pux1">Puxador Aço Inox Prata Escovado Tubular Reto 40cm</option>
        <option value="pux2">Puxador Alumínio Preto Barra Reta 40cm Geris Eco</option>
        <option value="pux3">Puxador Aço Inox Prata Escovado Tubular Reto 40cm</option>
        <option value="pux4">Puxador Aço Inox Prata Polido Tubular Reto 40cm</option>
        <option value="pux5">Puxador Alumínio Preto Barra Reta 75cm Geris Eco</option>
      </select>
    </div>

  </div>

  <script>
    // Mapeamento centralizado de produtos, imagens e preços
    const produtos = {
      portas: {
        por1: { preco: 1498.90, img: 'assets/portabranca.png' },
        por2: { preco: 1626.49, img: 'assets/portacurupixa.png' }
      },
      fechaduras: {
        fec1: { preco: 920.11, img: 'assets/ESF-DE4000B.png', width: '8%', height: '8%' },
        fec2: { preco: 920.11, img: 'assets/fechadura_biometria_esf_de4000b.png', width: '8%', height: '8%' },
        fec3: { preco: 1319.19, img: 'assets/MFV300.webp', width: '8%', height: '8%' },
        fec4: { preco: 549.90, img: 'assets/FV101.png', width: '5%', height: '4%' },
        fec5: { preco: 699.90, img: 'assets/fechadura_senha_e_tag_tecno_prata.png', width: '5%', height: '4%' }
      },
      puxadores: {
        pux1: { preco: 134.90, img: 'assets/puxador_30cm_aco_escovado.png', width: '2%', height: '10%' },
        pux2: { preco: 99.90, img: 'assets/puxador_40cm_aluminio_preto.png', width: '4%', height: '10%' },
        pux3: { preco: 190.90, img: 'assets/puxador_40cm_inox_escovado.png', width: '4%', height: '10%' },
        pux4: { preco: 238.90, img: 'assets/puxador_40cm_inox_polido.png', width: '2%', height: '10%' },
        pux5: { preco: 358.99, img: 'assets/puxador_75cm_aluminio_preto.png', width: '6%', height: '15%' }
      }
    };

    // Elementos DOM
    const selectPorta = document.getElementById('opPort');
    const selectFechadura = document.getElementById('opFec');
    const selectPuxador = document.getElementById('opPux');

    const elPorta = document.getElementById('porta');
    const elFechadura = document.getElementById('fechadura');
    const elPuxador = document.getElementById('puxador');

    const elPreco1 = document.getElementById('preco1');
    const elPreco2 = document.getElementById('preco2');
    const elPreco3 = document.getElementById('preco3');
    const elTotal = document.getElementById('total');

    // Função auxiliar para formatação em BRL (R$)
    const formatarMoeda = (valor) => {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    // Atualizador de estado e interface
    function atualizarConfiguracao() {
      const portaSel = produtos.portas[selectPorta.value];
      const fechaduraSel = produtos.fechaduras[selectFechadura.value];
      const puxadorSel = produtos.puxadores[selectPuxador.value];

      let vPorta = 0, vFechadura = 0, vPuxador = 0;

      // 1. Atualiza Porta
      if (portaSel) {
        vPorta = portaSel.preco;
        elPorta.style.backgroundImage = `url("${portaSel.img}")`;
        elPreco1.innerText = formatarMoeda(vPorta);
      } else {
        elPorta.style.backgroundImage = '';
        elPreco1.innerText = formatarMoeda(0);
      }

      // 2. Atualiza Fechadura
      if (fechaduraSel) {
        vFechadura = fechaduraSel.preco;
        elFechadura.style.backgroundImage = `url("${fechaduraSel.img}")`;
        elFechadura.style.width = fechaduraSel.width;
        elFechadura.style.height = fechaduraSel.height;
        elPreco2.innerText = formatarMoeda(vFechadura);
      } else {
        elFechadura.style.backgroundImage = '';
        elPreco2.innerText = formatarMoeda(0);
      }

      // 3. Atualiza Puxador (Apenas se as fechaduras específicas sobrepor/compatíveis estiverem selecionadas, mantendo a regra de negócio original)
      const fechaduraPermitePuxador = ['fec4', 'fec5'].includes(selectFechadura.value);

      if (puxadorSel && fechaduraPermitePuxador) {
        vPuxador = puxadorSel.preco;
        elPuxador.style.backgroundImage = `url("${puxadorSel.img}")`;
        elPuxador.style.width = puxadorSel.width;
        elPuxador.style.height = puxadorSel.height;
        elPreco3.innerText = formatarMoeda(vPuxador);
      } else {
        elPuxador.style.backgroundImage = '';
        elPreco3.innerText = formatarMoeda(0);
        vPuxador = 0;
      }

      // 4. Calcula e Exibe Total
      const valorTotal = vPorta + vFechadura + vPuxador;
      elTotal.innerText = formatarMoeda(valorTotal);
    }

    // Escutadores de evento nos selects
    selectPorta.addEventListener('change', atualizarConfiguracao);
    selectFechadura.addEventListener('change', atualizarConfiguracao);
    selectPuxador.addEventListener('change', atualizarConfiguracao);
  </script>
</body>
</html>
